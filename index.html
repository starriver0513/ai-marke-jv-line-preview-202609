<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#071321" />
    <title>AIマーケティング構築講座｜LINE配信確認</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="workspace">
      <aside class="control-panel" aria-label="プレビュー設定">
        <div class="eyebrow">CLIENT REVIEW</div>
        <h1>LINE配信<br />確認プレビュー</h1>
        <p class="lead">シート原文・手動改行・画像の並びを、そのまま確認できます。</p>

        <div class="notice" role="note">
          <span class="notice-dot" aria-hidden="true"></span>
          <span>確認専用。LINEへの実送信はされません。</span>
        </div>

        <div class="control-group">
          <div class="control-label">配信元</div>
          <div class="channel-tabs" id="channelTabs" role="tablist" aria-label="配信元を選択"></div>
        </div>

        <div class="control-group device-control">
          <div class="control-label">端末幅</div>
          <div class="device-options" id="deviceOptions" aria-label="端末幅を選択">
            <button type="button" data-width="375">375</button>
            <button type="button" data-width="390" class="is-active">390</button>
            <button type="button" data-width="430">430</button>
          </div>
          <p class="helper">文字数ではなく、選んだ画面幅で実際に折り返します。</p>
        </div>

        <div class="control-group message-index-group">
          <div class="control-label-row">
            <div class="control-label">配信一覧</div>
            <span id="messageCount" class="count"></span>
          </div>
          <nav class="message-index" id="messageIndex" aria-label="配信一覧"></nav>
        </div>
      </aside>

      <main class="preview-stage">
        <div class="phone-shell" id="phoneShell" style="--device-width: 390px">
          <div class="phone-status" aria-hidden="true">
            <span>9:41</span>
            <span class="status-icons">● ◖ ▰</span>
          </div>

          <header class="line-header">
            <button class="icon-button" type="button" aria-label="戻る（確認画面のため動作しません）" disabled>
              <span aria-hidden="true">‹</span>
            </button>
            <div class="room-heading">
              <div class="room-name" id="roomName"></div>
              <div class="room-subtitle">オープンチャット・確認用</div>
            </div>
            <button class="icon-button dots" type="button" aria-label="メニュー（確認画面のため動作しません）" disabled>
              <span aria-hidden="true">•••</span>
            </button>
          </header>

          <div class="preview-banner">公式LINE画面ではなく、表示確認用の再現です</div>

          <section class="chat-thread" id="chatThread" aria-live="polite">
            <div class="date-pill" id="datePill"></div>
            <div class="message-row">
              <div class="avatar" id="senderAvatar" aria-hidden="true"></div>
              <div class="message-stack">
                <div class="sender-name" id="senderName"></div>
                <div id="messageParts"></div>
                <button class="image-message" id="imageMessage" type="button" hidden>
                  <img id="messageImage" alt="" />
                  <span class="image-zoom-hint" aria-hidden="true">拡大</span>
                </button>
                <div class="message-time" id="messageTime"></div>
              </div>
            </div>
          </section>

          <footer class="line-composer" aria-label="送信欄（確認画面のため利用できません）">
            <button type="button" disabled aria-label="追加">＋</button>
            <div class="composer-field">確認用プレビュー</div>
            <button type="button" disabled aria-label="スタンプ">☺</button>
          </footer>
        </div>
      </main>

      <aside class="review-panel" aria-label="配信情報">
        <div class="review-kicker" id="reviewKicker"></div>
        <h2 id="reviewTitle"></h2>

        <dl class="review-details">
          <div>
            <dt>配信タイミング</dt>
            <dd id="detailTiming"></dd>
          </div>
          <div>
            <dt>シート設定日時</dt>
            <dd id="detailDate"></dd>
          </div>
          <div>
            <dt>本文</dt>
            <dd id="detailText"></dd>
          </div>
          <div>
            <dt>画像素材</dt>
            <dd id="detailAsset"></dd>
          </div>
        </dl>

        <div class="review-note">
          <strong>表示ルール</strong>
          <p>原稿の改行・空行を保持し、さらに端末幅に合わせて自動で折り返します。本文中のURLは誤操作防止のためクリックできません。</p>
        </div>

        <div class="pager">
          <button type="button" id="prevButton">← 前の配信</button>
          <button type="button" id="nextButton">次の配信 →</button>
        </div>
      </aside>
    </div>

    <dialog class="image-dialog" id="imageDialog">
      <button class="dialog-close" id="dialogClose" type="button" aria-label="画像を閉じる">×</button>
      <img id="dialogImage" alt="配信画像の拡大表示" />
      <p id="dialogCaption"></p>
    </dialog>

    <noscript>この確認ページの表示にはJavaScriptが必要です。</noscript>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
