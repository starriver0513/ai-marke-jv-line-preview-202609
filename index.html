<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
<meta name="referrer" content="no-referrer" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#071321" />
<title>AIマーケティング構築講座｜LINE配信確認</title>
<link rel="stylesheet" href="styles.css?v=scroll2" />
</head>
<body class="timeline-view">
<div class="workspace">
<aside class="control-panel" aria-label="プレビュー設定">
<div class="eyebrow">CLIENT REVIEW</div>
<h1>LINE配信<br />確認プレビュー</h1>
<p class="lead">スクロールして、すべての配信を続けて確認できます。</p>
<div class="control-group"><div class="channel-tabs" id="channelTabs" role="tablist" aria-label="配信元を選択"></div></div>
<div class="control-group device-control">
<div class="control-label">端末幅</div>
<div class="device-options" id="deviceOptions" aria-label="端末幅を選択">
<button type="button" data-width="375">375</button>
<button type="button" data-width="390" class="is-active">390</button>
<button type="button" data-width="430">430</button>
</div>
<p class="helper">本文の改行を保持し、端末幅に合わせて折り返します。</p>
</div>
</aside>
<main class="preview-stage">
<div class="phone-shell" id="phoneShell" style="--device-width: 390px">
<header class="line-header"><div class="room-heading">
<div class="room-name" id="roomName"></div>
<div class="room-subtitle">全配信をスクロールで確認</div>
</div></header>
<div class="preview-banner">LINE風の確認用プレビュー</div>
<section class="chat-thread" id="chatThread" aria-label="配信ログ"></section>
</div>
</main>
</div>
<dialog class="image-dialog" id="imageDialog">
<button class="dialog-close" id="dialogClose" type="button" aria-label="画像を閉じる">×</button>
<img id="dialogImage" alt="配信画像の拡大表示" /><p id="dialogCaption"></p>
</dialog>
<noscript>この確認ページの表示にはJavaScriptが必要です。</noscript>
<script src="data.js"></script><script src="app.js?v=scroll2"></script>
</body>
</html>
